document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<link rel=\"preconnect\" href=\"https://api.fontshare.com\" crossorigin=\"\">\n<link rel=\"preconnect\" href=\"https://cdn.fontshare.com\" crossorigin=\"\">\n<style>/* General Sans */\n@font-face {\n  font-family: 'General Sans';\n  src: url(\"52dca450-2f5e-496e-af2e-3725925f901a\") format('woff2'),\n       url(\"e0d6b86b-3cb5-43c4-989d-129149631007\") format('woff'),\n       url(\"89a4b50a-6b45-4de3-b585-2c1cb2c822a0\") format('truetype');\n  font-weight: 200 700;\n  font-display: swap;\n  font-style: normal;\n}\n\n\n<\u002Fstyle>\n<title>Science Note popup · Final<\u002Ftitle>\n<style>\n  :root {\n    --font: 'General Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;\n    --plum-0: #F4EEF6; --plum-1: #E7DBEB; --plum-2: #D0BAD8; --plum-3: #BC9EC7; --plum-4: #9970A9;\n    --plum-5: #795288; --plum-6: #694677; --plum-7: #593A64; --plum-8: #452C4E; --plum-9: #2E1D35;\n    --accent: #2424F5; --accent-on-dark: #4065F7;\n    --ink: #111827; --body: #4b5563; --meta: #6b7280; --line: #e5e7eb; --surface: #ffffff; --canvas: #f3f4f6;\n    --radius: 2px; --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;\n    --sn-width: 740px; --sn-max-h: min(86vh, 620px);\n  }\n\n  :root { --sn-page: #d9dbe0; --sn-panel: #FAF6FB; --sn-panel-line: #EFE5F2; --sn-label: var(--plum-8); --sn-item: var(--ink); --sn-check: var(--plum-5); --sn-link-border: var(--plum-1); --sn-tile: var(--plum-0); }\n  :root[data-theme=\"dark\"] {\n    --ink: #F5F5F5; --body: #C9C9CE; --meta: #A3A3A3; --line: #333333; --surface: #1A1A1A; --canvas: #000000; --accent: #4065F7;\n    --sn-page: #0b0b0c; --sn-panel: #241A29; --sn-panel-line: #3A2A42; --sn-label: #E7DBEB; --sn-item: #F5F5F5; --sn-check: #BC9EC7; --sn-link-border: #452C4E; --sn-tile: #2E1D35;\n  }\n  :root[data-theme=\"dark\"] { --surface: #26232A; --line: #3D3842; --sn-panel: #312B36; --sn-panel-line: #3E3644; --sn-link-border: #4D4354; --sn-card: #3A333F; --meta: #B3AEB8; }\n  :root[data-theme=\"dark\"] .sn-c__rail { background: var(--plum-8); border-right: 1px solid #4D4354; }\n  :root[data-theme=\"dark\"] .sn-c__about { border-top-color: rgba(255, 255, 255, 0.2); }\n  :root[data-theme=\"dark\"] .sn-c__summary { color: rgba(255, 255, 255, 0.88); }\n  :root[data-theme=\"dark\"] .sn-flow__go, :root[data-theme=\"dark\"] .sn-flow__num { color: var(--plum-3); }\n  :root[data-theme=\"dark\"] .sn-c .sn-cta { background: var(--plum-5); border-color: var(--plum-4); }\n  :root[data-theme=\"dark\"] .sn { box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); border: 1px solid #4D4354; }\n  *, *::before, *::after { box-sizing: border-box; }\n  body { margin: 0; font-family: var(--font); color: var(--body); background: var(--sn-page); }\n  a { color: var(--plum-5); }\n  a:hover { color: var(--plum-7); }\n  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }\n\n  /* Product context (mock Note Catalog, not part of the template) */\n  .cat-page { min-height: 100vh; display: flex; padding: var(--s6); background: var(--sn-page); }\n  .cat { flex: 1; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }\n  .cat__head { padding: var(--s4) var(--s6); border-bottom: 1px solid var(--line); }\n  .cat__head { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); }\n  .cat__theme { white-space: nowrap; position: fixed; top: 12px; right: 12px; z-index: 20; height: 32px; padding: 0 var(--s3); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font: 600 13px var(--font); color: var(--ink); cursor: pointer; }\n  .cat__theme[aria-pressed=\"true\"] { background: var(--plum-5); border-color: var(--plum-5); color: #fff; }\n  .cat__theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n  .cat__title { margin: 0; font-size: 22px; font-weight: 700; color: var(--ink); }\n  .cat__body { flex: 1; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: var(--s6); padding: var(--s6); }\n  .cat__filters { align-self: start; display: flex; flex-direction: column; gap: var(--s3); padding: var(--s4); border: 1px solid var(--line); border-radius: var(--radius); }\n  .cat__search { height: 36px; display: flex; align-items: center; padding: 0 var(--s3); border: 1px solid var(--line); border-radius: var(--radius); font-size: 14px; color: var(--meta); }\n  .cat__group { margin: var(--s1) 0 0; font-size: 13px; font-weight: 600; color: var(--ink); }\n  .cat__chips { display: flex; flex-wrap: wrap; gap: var(--s2); }\n  .cat__chip { height: 32px; display: inline-flex; align-items: center; padding: 0 var(--s3); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; font-weight: 600; color: var(--ink); }\n  .cat__chip.is-on { background: var(--plum-0); border-color: var(--plum-2); color: var(--plum-7); }\n  .cat__list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--s3); align-content: start; }\n  .cat__card { display: grid; grid-template-columns: 36px minmax(0, 1fr) 32px; gap: var(--s3); align-items: start; padding: var(--s4); border: 1px solid var(--line); border-radius: var(--radius); }\n  .cat__icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--sn-tile); color: var(--sn-check); border-radius: var(--radius); }\n  .cat__name { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }\n  .cat__meta { margin: var(--s1) 0 0; font-size: 13px; color: var(--meta); }\n  .cat__info { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; background: none; border: 0; border-radius: var(--radius); color: var(--meta); cursor: pointer; }\n  .cat__info:hover { background: var(--plum-0); color: var(--plum-6); }\n  .cat__info:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n  .cat__info[disabled] { opacity: 0.35; cursor: default; background: none; }\n  @media (max-width: 760px) { .cat-page { padding: 0; } .cat__body { grid-template-columns: minmax(0, 1fr); } .cat__filters { display: none; } }\n\n  /* Popup shell */\n  .sn-backdrop { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: var(--s4); background: rgba(17, 24, 39, 0.42); }\n  .sn-backdrop[hidden] { display: none; }\n  .sn { width: 100%; max-width: var(--sn-width); max-height: var(--sn-max-h); display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border-radius: var(--radius); box-shadow: 0 12px 32px rgba(46, 29, 53, 0.28); }\n  .sn:focus { outline: none; }\n  .sn :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n  /* Shared template parts */\n  .sn-label { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--sn-label); }\n  .sn-label span { white-space: nowrap; }\n  .sn-label svg { flex-shrink: 0; color: var(--sn-check); }\n  .sn-panel { padding: 10px 14px 12px; background: var(--sn-panel); border: 1px solid var(--sn-panel-line); border-radius: var(--radius); }\n  .sn-panel > .sn-label { margin: 0 0 6px; }\n  .sn-panel--row { display: flex; align-items: center; gap: var(--s4); }\n  .sn-panel--row > .sn-label { flex-shrink: 0; margin: 0; }\n  .sn-summary { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--ink); text-wrap: pretty; }\n  .sn-benefits { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px var(--s5); }\n  .sn-benefits.is-2col { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .sn-benefits li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: var(--s2); align-items: start; font-size: 13px; line-height: 1.45; color: var(--ink); }\n  .sn-benefits svg { margin-top: 2px; color: var(--sn-check); }\n  .sn-uses { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--sn-use-min, 240px), 1fr)); gap: 6px var(--s5); }\n  .sn-uses strong { display: block; font-size: 13px; font-weight: 500; line-height: 1.4; color: var(--sn-item); }\n  .sn-uses span { display: block; font-size: 12.5px; line-height: 1.45; color: var(--meta); text-wrap: pretty; }\n  .sn-flow { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 6px; }\n  .sn-flow li { display: flex; align-items: center; gap: 6px; min-width: 0; }\n  .sn-flow li + li::before { content: \"\"; flex-shrink: 0; width: 6px; height: 6px; margin-right: 4px; border-top: 1.5px solid var(--plum-3); border-right: 1.5px solid var(--plum-3); transform: rotate(45deg); }\n  .sn-flow a { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; white-space: nowrap; background: var(--sn-card, var(--surface)); border: 1px solid var(--sn-link-border); border-radius: var(--radius); text-decoration: none; transition: border-color 0.15s, background-color 0.15s; }\n  .sn-flow a:hover { border-color: var(--plum-3); }\n  .sn-flow__num { display: none; font-size: 11px; font-weight: 600; color: var(--plum-5); }\n  .sn-flow__title { font-size: 13px; font-weight: 600; color: var(--ink); }\n  .sn-flow__go { display: flex; color: var(--accent); }\n  .sn-cta { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 var(--s4); white-space: nowrap; background: var(--plum-5); color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; border-radius: var(--radius); }\n  .sn-cta:hover { background: var(--plum-6); color: #fff; }\n  .sn-close { flex-shrink: 0; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 0; border-radius: var(--radius); color: var(--meta); cursor: pointer; }\n  .sn-close:hover { background: var(--sn-panel); color: var(--ink); }\n\n  @media (max-width: 600px) {\n    .sn-panel--row { flex-direction: column; align-items: flex-start; gap: 6px; }\n    .sn-flow { flex-wrap: wrap; }\n    .sn-benefits.is-2col { grid-template-columns: minmax(0, 1fr); }\n  }\n\n  /* Concept glyphs: one small animated diagram per Note type */\n  .g { display: block; width: 100%; height: 100%; overflow: visible; }\n  .g-edge { fill: none; stroke: var(--g-edge); stroke-width: 1.5; }\n  .g-node { fill: var(--g-fill); stroke: var(--g-stroke); stroke-width: 1.2; }\n  .g-dot { fill: var(--g-dot); }\n  .g-after { stroke: var(--g-hl); stroke-width: 1.75; }\n  .g-before { animation: g-out 6s ease-in-out infinite; }\n  .g-after { animation: g-in 6s ease-in-out infinite; }\n  .g-closing { animation: g-dim 6s ease-in-out infinite; }\n  .g-axis { fill: none; stroke: var(--g-edge); stroke-width: 1; opacity: 0.6; }\n  .g-band, .g-track { fill: var(--g-band); }\n  .g-fc { fill: none; stroke: var(--g-hl); stroke-width: 1.6; stroke-dasharray: 3 3; }\n  .g-bar, .g-pt, .g-col { fill: var(--g-stroke); }\n  .g-bar { transform-box: fill-box; transform-origin: left center; animation: g-grow 4.5s ease-out infinite; }\n  .g-ring { fill: none; stroke: var(--g-edge); stroke-width: 1; stroke-dasharray: 2 3; }\n  .g-bar--hl, .g-pt--hl, .g-core { fill: var(--g-hl); }\n  @keyframes g-grow { 0% { transform: scaleX(0.15); } 35%, 100% { transform: scaleX(1); } }\n  @keyframes g-out { 0%, 35% { opacity: 1; } 50%, 85% { opacity: 0; } 100% { opacity: 1; } }\n  @keyframes g-in { 0%, 35% { opacity: 0; } 50%, 85% { opacity: 1; } 100% { opacity: 0; } }\n  @keyframes g-dim { 0%, 35% { opacity: 1; } 50%, 85% { opacity: 0.25; } 100% { opacity: 1; } }\n  .g-dark { --g-edge: var(--plum-4); --g-fill: var(--plum-8); --g-stroke: var(--plum-3); --g-dot: var(--accent-on-dark); --g-hl: var(--accent-on-dark); --g-band: rgba(188, 158, 199, 0.22); }\n  .g-light { --g-edge: var(--plum-2); --g-fill: var(--surface); --g-stroke: var(--plum-5); --g-dot: var(--accent); --g-hl: var(--accent); --g-band: rgba(121, 82, 136, 0.12); }\n  @media (prefers-reduced-motion: reduce) {\n    .g-dot { display: none; }\n    .g-before, .g-after, .g-closing { animation: none; }\n    .g-before { opacity: 0; }\n    .g-closing { opacity: 0.25; }\n    .g-bar { animation: none; }\n  }\n\n  /* Layout-specific */\n  .sn-c { flex-direction: row; --sn-use-min: 170px; }\n  .sn-c__rail { flex-shrink: 0; width: 240px; display: flex; flex-direction: column; padding: 22px var(--s5) var(--s5); color: #fff; background: var(--plum-9); }\n  .sn-c__rail :focus-visible { outline-color: #fff; }\n  .sn-c__eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--plum-3); }\n  .sn-c__title { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.25; color: #fff; }\n  .sn-c__subtitle { margin: 6px 0 0; font-size: 13px; line-height: 1.45; color: var(--plum-1); }\n  .sn-c__glyph { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 96px; padding: var(--s4) 0; }\n  .sn-c__glyph .g { width: 100%; height: auto; max-height: 120px; }\n  .sn-c .sn-cta { align-self: flex-start; height: 34px; padding: 0 12px; font-size: 13px; border: 1px solid var(--plum-4); }\n  .sn-c__main { position: relative; flex: 1; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--s2); padding: 18px var(--s5) var(--s4); }\n  .sn-c__about { margin: var(--s5) 0; padding-top: var(--s4); border-top: 1px solid rgba(255, 255, 255, 0.14); }\n  .sn-c__about-label { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--plum-3); }\n  .sn-c__summary { margin: 0; font-size: 13px; line-height: 1.55; color: rgba(255, 255, 255, 0.8); }\n  .sn-c .sn-cta { margin-top: auto; }\n  .sn-c__main > .sn-close { position: absolute; top: 6px; right: 8px; z-index: 1; }\n  .sn-c__main { padding-top: 40px !important; }\n  .sn-c .sn-summary { padding-right: 28px; margin-bottom: 4px; font-size: 14px; }\n  .sn-c .sn-benefits.is-2col { grid-template-columns: minmax(0, 1fr); }\n  .sn-c .sn-flow { flex-direction: column; align-items: stretch; gap: 4px; }\n  .sn-c .sn-flow li + li::before { display: none; }\n  .sn-c .sn-flow a { width: 100%; height: auto; min-height: 28px; padding: 5px 10px; white-space: normal; align-items: baseline; }\n  .sn-c__main > .sn-sec { flex-shrink: 0; }\n  .sn-c .sn-sec > .sn-label { margin: 0 0 6px; }\n  .sn-c .sn-panel { padding: 10px 12px; }\n  .sn-c .sn-uses strong { margin-bottom: 4px; font-size: 13px; font-weight: 600; white-space: nowrap; }\n  .sn-c .sn-uses span { font-size: 12px; }\n  .sn-c .sn-uses li { padding: 8px 9px; background: var(--sn-card, var(--surface)); border: 1px solid var(--sn-link-border); border-radius: var(--radius); }\n  .sn-c__main { gap: 14px !important; }\n  .sn-c .sn-uses { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px var(--s2); }\n  .sn-flow__text { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 4px; font-size: 13px; line-height: 1.4; }\n  .sn-c .sn-flow__title { flex-shrink: 0; white-space: nowrap; }\n  .sn-flow__desc { flex: 1; min-width: 0; font-size: 12.5px; color: var(--meta); white-space: nowrap; }\n  .sn-c .sn-flow__go { align-self: center; }\n  @media (max-width: 640px) { .sn-c .sn-uses { grid-template-columns: minmax(0, 1fr); } }\n  .sn-c .sn-flow__num { display: inline; }\n  .sn-c .sn-flow__go { margin-left: auto; }\n  @media (max-width: 640px) {\n    .sn-c { flex-direction: column; }\n    .sn-c__rail { width: auto; padding: var(--s4); }\n    .sn-c__glyph { display: none; }\n    .sn-c .sn-cta { margin-top: var(--s3); }\n    .sn-c__main { padding: var(--s4); }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"cat-page\">\n  <div class=\"cat\">\n    <div class=\"cat__head\"><h1 class=\"cat__title\">Note Catalog<\u002Fh1><button type=\"button\" class=\"cat__theme\" id=\"theme-toggle\" aria-pressed=\"false\">Dark mode<\u002Fbutton><\u002Fdiv>\n    <div class=\"cat__body\">\n      <aside class=\"cat__filters\">\n        <div class=\"cat__search\">Search notes<\u002Fdiv>\n        <p class=\"cat__group\">Note Group<\u002Fp>\n        <div class=\"cat__chips\"><span class=\"cat__chip is-on\">Meridian Notes<\u002Fspan><span class=\"cat__chip\">Custom Notes<\u002Fspan><span class=\"cat__chip\">Prediction Notes<\u002Fspan><\u002Fdiv>\n      <\u002Faside>\n      <div class=\"cat__list\">\n        <div class=\"cat__card\"><span class=\"cat__icon\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M13 3L5 13.5h6L10 21l8-10.5h-6L13 3z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><div><p class=\"cat__name\">Propagate Demand<\u002Fp><p class=\"cat__meta\">Created by Meridian<\u002Fp><\u002Fdiv><button type=\"button\" class=\"cat__info\" data-note=\"propagate-demand\" aria-label=\"About Propagate Demand\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"7.5\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fcircle><path d=\"M10 9v4.5M10 6.5v.01\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n        <div class=\"cat__card\"><span class=\"cat__icon\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M13 3L5 13.5h6L10 21l8-10.5h-6L13 3z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><div><p class=\"cat__name\">Optimize Network<\u002Fp><p class=\"cat__meta\">Created by Meridian<\u002Fp><\u002Fdiv><button type=\"button\" class=\"cat__info\" data-note=\"optimize-network\" aria-label=\"About Optimize Network\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"7.5\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fcircle><path d=\"M10 9v4.5M10 6.5v.01\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n        <div class=\"cat__card\"><span class=\"cat__icon\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M13 3L5 13.5h6L10 21l8-10.5h-6L13 3z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><div><p class=\"cat__name\">Optimize DC Allotment<\u002Fp><p class=\"cat__meta\">Created by Meridian<\u002Fp><\u002Fdiv><button type=\"button\" class=\"cat__info\" disabled=\"\" aria-label=\"About Optimize DC Allotment (not in this prototype)\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"7.5\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fcircle><path d=\"M10 9v4.5M10 6.5v.01\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n        <div class=\"cat__card\"><span class=\"cat__icon\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M13 3L5 13.5h6L10 21l8-10.5h-6L13 3z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><div><p class=\"cat__name\">Optimize Routes<\u002Fp><p class=\"cat__meta\">Created by Meridian<\u002Fp><\u002Fdiv><button type=\"button\" class=\"cat__info\" disabled=\"\" aria-label=\"About Optimize Routes (not in this prototype)\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"7.5\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fcircle><path d=\"M10 9v4.5M10 6.5v.01\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"sn-backdrop\" id=\"sn-backdrop\" hidden=\"\">\n  <div class=\"sn sn-c\" id=\"sn\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sn-title\" tabindex=\"-1\"><\u002Fdiv>\n<\u002Fdiv>\n<script>\n/* ===== Layout: renderNote() builds the popup from one NOTES entry ===== */\n/* Add ?glyph=off to the URL to preview the layout without the concept diagram */\nvar NO_GLYPH = true;\nfunction renderNote(n) {\n  return '<aside class=\"sn-c__rail\"><p class=\"sn-c__eyebrow\">Science Note<\u002Fp><h2 class=\"sn-c__title\" id=\"sn-title\">' + esc(n.title) + '<\u002Fh2>'\n    + (NO_GLYPH ? '<div class=\"sn-c__about\"><p class=\"sn-c__about-label\">About this note<\u002Fp><p class=\"sn-c__summary\">' + esc(n.summary) + '<\u002Fp><\u002Fdiv>' : '<div class=\"sn-c__glyph\">' + glyph(n.glyph || glyphFor(n.title), 'dark') + '<\u002Fdiv>') + ctaHTML(n) + '<\u002Faside>'\n    + '<div class=\"sn-c__main\">' + closeBtn()\n    + (NO_GLYPH ? '' : '<p class=\"sn-summary\">' + esc(n.summary) + '<\u002Fp>')\n    + panel('Key benefits', benefitsHTML(n))\n    + panel('Common use cases', usesHTML(n))\n    + panel('How to use it', flowHTML(n))\n    + '<\u002Fdiv>';\n}\n\n/* ===== Content: one entry per Science Note. This is the only part that changes per Note. ===== */\nvar NOTES = {\n  'propagate-demand': {\n    title: 'Propagate Demand',\n    subtitle: 'Get the right demand at every level of your supply chain',\n    summary: 'Rolls demand up from where it occurs to the locations, products and materials that supply it. Works across any number of supply chain levels, configured through your data.',\n    glyph: 'flow',\n    benefits: [\n      'Follows sourcing rules and share of business',\n      'Carries forecast error with demand',\n      'Breaks finished goods into components (BoM)'\n    ],\n    useCases: [\n      ['Material Planning', 'Raw and packaging needs from finished goods'],\n      ['Inventory Planning', 'DC-level demand and variance for stock targets'],\n      ['Order Aggregation', 'Branch sales orders to a fulfillment center']\n    ],\n    docs: '#'\n  },\n  'optimize-network': {\n    title: 'Optimize Network',\n    subtitle: 'Improve your supply chain networks to cut costs and meet demand',\n    summary: 'Designs your supply chain network, from facility locations to production, sourcing and distribution routes.',\n    glyph: 'network',\n    benefits: [\n      'Plans warehouse and facility locations',\n      'Optimizes production, sourcing and routes',\n      'Supports strategic and tactical decisions'\n    ],\n    useCases: [\n      ['Strategic Planning', 'Annual budgets, S&OP, long-term plans'],\n      ['Network Design', 'Optimize warehouses and distribution centers'],\n      ['Tactical Planning', 'Monthly sourcing and production allocation']\n    ],\n    docs: '#'\n  }\n};\n\n/* Shared workflow. Each step links to a section of the Note's documentation (anchor names to confirm). */\nvar WORKFLOW = [\n  { anchor: 'input-data', title: 'Map Input Tables', desc: \"Connect your data to the Note's input tables.\" },\n  { anchor: 'parameters', title: 'Set Parameters', desc: \"Adjust the Note's settings (optional).\" },\n  { anchor: 'run', title: 'Run the Note', desc: 'Turn your input data into outputs.' },\n  { anchor: 'outputs', title: 'Get Outputs', desc: 'Review outputs and make decisions.' }\n];\n\n/* ===== Template helpers (shared by every Note) ===== */\nvar ICON_CHECK = '<svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8.5l3 3 7-7\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>';\nvar ICON_GO = '<svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M5.5 3.5h7v7M12.5 3.5l-9 9\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>';\nvar ICON_CLOSE = '<svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3.5 3.5l9 9M12.5 3.5l-9 9\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><\u002Fsvg>';\nvar NEW_TAB = '<span class=\"sr-only\"> (opens in a new tab)<\u002Fspan>';\nfunction esc(s) { return String(s).replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }\nfunction ext(href) { return 'href=\"' + esc(href) + '\" target=\"_blank\" rel=\"noopener noreferrer\"'; }\nfunction closeBtn() { return '<button type=\"button\" class=\"sn-close\" data-sn-close aria-label=\"Close\">' + ICON_CLOSE + '<\u002Fbutton>'; }\nfunction benefitsHTML(n) { return '<ul class=\"sn-benefits' + (n.benefits.length > 3 ? ' is-2col' : '') + '\">' + n.benefits.map(function (b) { return '<li>' + ICON_CHECK + '<span>' + esc(b) + '<\u002Fspan><\u002Fli>'; }).join('') + '<\u002Ful>'; }\nfunction usesHTML(n) { return '<ul class=\"sn-uses\">' + n.useCases.map(function (u) { return '<li><strong>' + esc(u[0]) + '<\u002Fstrong><span>' + esc(u[1]) + '<\u002Fspan><\u002Fli>'; }).join('') + '<\u002Ful>'; }\nfunction flowHTML(n) {\n  return '<ol class=\"sn-flow\">' + WORKFLOW.map(function (w, i) {\n    return '<li><a ' + ext(n.docs + '#' + w.anchor) + '><span class=\"sn-flow__num\">0' + (i + 1) + '<\u002Fspan><span class=\"sn-flow__text\"><span class=\"sn-flow__title\">' + esc(w.title) + ':<\u002Fspan> <span class=\"sn-flow__desc\">' + esc(w.desc) + '<\u002Fspan><\u002Fspan><span class=\"sn-flow__go\">' + ICON_GO + '<\u002Fspan>' + NEW_TAB + '<\u002Fa><\u002Fli>';\n  }).join('') + '<\u002Fol>';\n}\nfunction ctaHTML(n) { return '<a class=\"sn-cta\" ' + ext(n.docs) + '>Read full documentation <span aria-hidden=\"true\">→<\u002Fspan>' + NEW_TAB + '<\u002Fa>'; }\nvar LABEL_ICONS = {\n  'What it does': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"6.25\" stroke=\"currentColor\" stroke-width=\"1.4\"/><path d=\"M8 7.2v4M8 4.8v.01\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><\u002Fsvg>',\n  'Key benefits': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"6.25\" stroke=\"currentColor\" stroke-width=\"1.4\"/><path d=\"M5.2 8.2l1.9 1.9 3.7-3.9\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>',\n  'Use cases': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><rect x=\"1.75\" y=\"4.75\" width=\"12.5\" height=\"8.5\" rx=\"1\" stroke=\"currentColor\" stroke-width=\"1.4\"/><path d=\"M5.75 4.75V3h4.5v1.75M1.75 8.5h12.5\" stroke=\"currentColor\" stroke-width=\"1.4\"/><\u002Fsvg>',\n  'How it works': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><rect x=\"1\" y=\"6\" width=\"4\" height=\"4\" rx=\"0.5\" stroke=\"currentColor\" stroke-width=\"1.3\"/><rect x=\"11\" y=\"6\" width=\"4\" height=\"4\" rx=\"0.5\" stroke=\"currentColor\" stroke-width=\"1.3\"/><path d=\"M5 8h6M8.8 5.8L11 8l-2.2 2.2\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>'\n};\nfunction labelHTML(label) { return '<h3 class=\"sn-label\"><span>' + label + '<\u002Fspan><\u002Fh3>'; }\nfunction panel(label, html, cls) { return '<section class=\"sn-sec\">' + labelHTML(label) + '<div class=\"sn-panel' + (cls ? ' ' + cls : '') + '\">' + html + '<\u002Fdiv><\u002Fsection>'; }\n\nvar gid = 0;\nvar REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\nfunction anim(s) { return REDUCED ? '' : s; }\nfunction curve(a, b) { var x1 = a[0] + 4, x2 = b[0] - 4; return 'M' + x1 + ' ' + a[1] + ' C ' + (x1 + 26) + ' ' + a[1] + ', ' + (x2 - 26) + ' ' + b[1] + ', ' + x2 + ' ' + b[1]; }\nfunction gnode(p, cls) { return '<rect class=\"g-node' + (cls ? ' ' + cls : '') + '\" x=\"' + (p[0] - 4) + '\" y=\"' + (p[1] - 4) + '\" width=\"8\" height=\"8\" rx=\"1\"/>'; }\nfunction motion(path, dur, begin) { return anim('<animateMotion dur=\"' + dur + 's\" begin=\"-' + begin.toFixed(2) + 's\" repeatCount=\"indefinite\"><mpath href=\"#' + path + '\"/><\u002FanimateMotion>'); }\n\n/* Six glyph families cover the whole Note catalog. A Note is mapped by the verb in its name,\n   so new Notes (and their \"Interface\" versions) get a glyph with no extra work. Set NOTES[x].glyph to override. */\nfunction glyphFor(title) {\n  var t = String(title).replace(/\\s+interface$/i, '').toLowerCase();\n  if (/^(propagate|deploy)/.test(t)) return 'flow';\n  if (/(network|routes|greenfield|^sln|^oln)/.test(t)) return 'network';\n  if (/^(forecast|fit distribution|estimate|prepare time series)/.test(t)) return 'forecast';\n  if (/^(plan|prepare plan|optimize stock|optimize dc|promise|generate fulfillment)/.test(t)) return 'plan';\n  if (/^cluster/.test(t)) return 'cluster';\n  return 'generic';\n}\nfunction glyph(type, theme) {\n  var s = '', id = 'g' + (++gid);\n  if (type === 'propagate') type = 'flow';\n  if (type === 'flow') {\n    var L = [[8, 12], [8, 32], [8, 52]], M = [[66, 22], [66, 42]], R = [124, 32];\n    var E = [[L[0], M[0]], [L[1], M[0]], [L[2], M[1]], [M[0], R], [M[1], R]];\n    E.forEach(function (e, i) { s += '<path class=\"g-edge\" id=\"' + id + '-' + i + '\" d=\"' + curve(e[0], e[1]) + '\"/>'; });\n    E.forEach(function (e, i) { s += '<circle class=\"g-dot\" r=\"2\">' + motion(id + '-' + i, 1.8, i * 0.45 + 0.1) + '<\u002Fcircle>'; });\n    L.concat(M, [R]).forEach(function (p) { s += gnode(p); });\n  } else if (type === 'network') {\n    var P = [8, 32], D1 = [66, 16], D2 = [66, 48], C = [[124, 10], [124, 32], [124, 54]];\n    [[P, D1], [D1, C[0]], [D1, C[1]]].forEach(function (e) { s += '<path class=\"g-edge\" d=\"' + curve(e[0], e[1]) + '\"/>'; });\n    [[P, D2], [D2, C[2]]].forEach(function (e) { s += '<path class=\"g-edge g-before\" d=\"' + curve(e[0], e[1]) + '\"/>'; });\n    s += '<path class=\"g-edge g-after\" d=\"' + curve(D1, C[2]) + '\"/>';\n    s += gnode(P) + gnode(D1) + gnode(D2, 'g-closing') + C.map(function (p) { return gnode(p); }).join('');\n  } else if (type === 'forecast') {\n    s += '<path class=\"g-axis\" d=\"M4 58 H128\"/>';\n    s += '<path class=\"g-band\" d=\"M66 24 L84 17 L102 10 L126 8 L126 36 L102 32 L84 31 Z\"/>';\n    s += '<path class=\"g-edge\" d=\"M6 46 L18 38 L30 42 L42 30 L54 36 L66 24\"/>';\n    s += '<path class=\"g-fc\" id=\"' + id + '-f\" d=\"M66 24 L84 24 L102 21 L126 22\"/>';\n    s += '<circle class=\"g-dot\" r=\"2.5\">' + motion(id + '-f', 2.4, 0) + '<\u002Fcircle>';\n  } else if (type === 'plan') {\n    s += '<path class=\"g-axis\" d=\"M4 58 H128\"/>';\n    [[8, 10, 46], [24, 30, 58], [40, 52, 66]].forEach(function (r, i) {\n      s += '<rect class=\"g-track\" x=\"6\" y=\"' + r[0] + '\" width=\"120\" height=\"10\" rx=\"1\"/>';\n      s += '<rect class=\"g-bar' + (i === 1 ? ' g-bar--hl' : '') + '\" x=\"' + r[1] + '\" y=\"' + r[0] + '\" width=\"' + r[2] + '\" height=\"10\" rx=\"1\" style=\"animation-delay:' + (i * 0.3) + 's\"/>';\n    });\n  } else if (type === 'cluster') {\n    var K = [[28, 22], [66, 44], [106, 22]];\n    var pts = [[8, 8, 0], [44, 8, 0], [16, 40, 0], [46, 60, 1], [88, 58, 1], [70, 26, 1], [90, 4, 2], [126, 10, 2], [118, 42, 2]];\n    K.forEach(function (c) { s += '<circle class=\"g-ring\" cx=\"' + c[0] + '\" cy=\"' + c[1] + '\" r=\"13\"/>'; });\n    pts.forEach(function (p) {\n      var c = K[p[2]], tx = (c[0] + (p[0] - c[0]) * 0.3).toFixed(1), ty = (c[1] + (p[1] - c[1]) * 0.3).toFixed(1);\n      s += '<circle class=\"g-pt' + (p[2] === 1 ? ' g-pt--hl' : '') + '\" cx=\"' + p[0] + '\" cy=\"' + p[1] + '\" r=\"2.5\">'\n        + anim('<animate attributeName=\"cx\" dur=\"4.5s\" repeatCount=\"indefinite\" values=\"' + p[0] + ';' + tx + ';' + tx + ';' + p[0] + '\" keyTimes=\"0;0.35;0.8;1\"/><animate attributeName=\"cy\" dur=\"4.5s\" repeatCount=\"indefinite\" values=\"' + p[1] + ';' + ty + ';' + ty + ';' + p[1] + '\" keyTimes=\"0;0.35;0.8;1\"/>')\n        + '<\u002Fcircle>';\n    });\n  } else {\n    s += '<rect class=\"g-node\" x=\"6\" y=\"18\" width=\"26\" height=\"28\" rx=\"1\"/><path class=\"g-axis\" d=\"M11 26 H27 M11 32 H27 M11 38 H21\"/>';\n    s += '<path class=\"g-edge\" id=\"' + id + '-a\" d=\"M34 32 H52\"/><path class=\"g-edge\" id=\"' + id + '-b\" d=\"M80 32 H98\"/>';\n    s += '<rect class=\"g-core\" x=\"54\" y=\"18\" width=\"24\" height=\"28\" rx=\"1\"/>';\n    s += '<rect class=\"g-col\" x=\"102\" y=\"34\" width=\"6\" height=\"12\"/><rect class=\"g-col\" x=\"111\" y=\"26\" width=\"6\" height=\"20\"/><rect class=\"g-col\" x=\"120\" y=\"30\" width=\"6\" height=\"16\"/>';\n    s += '<circle class=\"g-dot\" r=\"2\">' + motion(id + '-a', 1.4, 0) + '<\u002Fcircle><circle class=\"g-dot\" r=\"2\">' + motion(id + '-b', 1.4, 0.7) + '<\u002Fcircle>';\n  }\n  return '<svg class=\"g ' + (theme === 'dark' ? 'g-dark' : 'g-light') + '\" viewBox=\"0 0 132 64\" aria-hidden=\"true\">' + s + '<\u002Fsvg>';\n}\n\n/* ===== Demo wiring: open from the catalog, close with x / Esc / backdrop ===== */\nvar backdrop = document.getElementById('sn-backdrop'), dialog = document.getElementById('sn'), trigger = null;\nfunction openNote(key, from) {\n  if (!NOTES[key]) return;\n  trigger = from || null;\n  dialog.innerHTML = renderNote(NOTES[key]);\n  backdrop.hidden = false;\n  dialog.focus();\n}\nfunction closeNote() { backdrop.hidden = true; if (trigger) trigger.focus(); }\ndialog.addEventListener('click', function (e) { if (e.target.closest('[data-sn-close]')) closeNote(); });\nbackdrop.addEventListener('mousedown', function (e) { backdrop._d = e.target === backdrop; });\nbackdrop.addEventListener('click', function (e) { if (e.target === backdrop && backdrop._d) closeNote(); });\ndocument.addEventListener('keydown', function (e) {\n  if (backdrop.hidden) return;\n  if (e.key === 'Escape') { e.preventDefault(); closeNote(); return; }\n  if (e.key !== 'Tab') return;\n  var f = Array.prototype.filter.call(dialog.querySelectorAll('a[href], button'), function (el) { return el.getClientRects().length; });\n  if (!f.length) return;\n  var a = document.activeElement;\n  if (e.shiftKey && (a === f[0] || a === dialog)) { e.preventDefault(); f[f.length - 1].focus(); }\n  else if (!e.shiftKey && a === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }\n});\ndocument.querySelectorAll('[data-note]').forEach(function (b) { b.addEventListener('click', function () { openNote(b.getAttribute('data-note'), b); }); });\nif (NO_GLYPH) dialog.classList.add('sn--noglyph');\nvar themeBtn = document.getElementById('theme-toggle');\nthemeBtn.addEventListener('click', function () {\n  var dark = document.documentElement.getAttribute('data-theme') !== 'dark';\n  if (dark) document.documentElement.setAttribute('data-theme', 'dark'); else document.documentElement.removeAttribute('data-theme');\n  themeBtn.setAttribute('aria-pressed', String(dark));\n});\nopenNote('propagate-demand', document.querySelector('[data-note=\"propagate-demand\"]'));\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
